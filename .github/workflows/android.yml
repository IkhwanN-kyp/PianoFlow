name: Android build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pianoflow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Verify source and dependency hashes
        run: |
          python3 scripts/check_repository.py
          python3 scripts/verify_vendor.py
          ./test-core.sh
      - name: Build and lint x86_64 runtime test APK
        run: |
          chmod +x gradlew test-core.sh
          ./gradlew --no-daemon -PtargetAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runtime tests on Android without Google Play Services
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_c
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w id.arus.piano.test/id.arus.piano.SmokeInstrumentation > runtime-test.txt
            cat runtime-test.txt
            grep -q 'PASS Android runtime' runtime-test.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-reports
          path: |
            runtime-test.txt
            app/build/reports/lint-results-debug.html
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Decode signing key into runner temporary storage
        env:
          SIGNING_KEY: ${{ secrets.PIANOFLOW_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/pianoflow.p12"
      - name: Build, sign, verify and package ARM64 release
        env:
          PIANOFLOW_STORE_PASSWORD: ${{ secrets.PIANOFLOW_STORE_PASSWORD }}
          PIANOFLOW_KEY_PASSWORD: ${{ secrets.PIANOFLOW_KEY_PASSWORD }}
          PIANOFLOW_KEY_ALIAS: ${{ secrets.PIANOFLOW_KEY_ALIAS }}
        run: |
          export PIANOFLOW_KEYSTORE="$RUNNER_TEMP/pianoflow.p12"
          VERSION="${RELEASE_TAG#v}"
          CODE="$(python3 scripts/version_code.py "$VERSION")"
          python3 scripts/verify_vendor.py
          ./gradlew --no-daemon -PreleaseVersion="$VERSION" -PreleaseCode="$CODE" :app:assembleRelease :app:lintRelease
          python3 scripts/prepare_release.py "$VERSION"
      - name: Publish complete release atomically from draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 scripts/release_notes.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "PianoFlow $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pianoflow.p12"
